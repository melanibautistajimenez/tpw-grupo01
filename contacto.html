<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finas Nails - Contacto y Reservas</title>
</head>
<body>

    <header>
        <h1>💖 Finas Nails</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="galeria.html">Galería</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <fieldset>
                <legend>Contáctanos</legend>
                <h2>Hablemos</h2>
                <p>¿Tienes una idea para tu próximo diseño de uñas? Escríbenos y cuéntanos qué tienes en mente.</p>
                <h3>Email</h3>
                <a href="mailto:finasnails@gmail.com">finasnails@gmail.com</a>
            </fieldset>
        </section>

        <section class="booking-form">
            <fieldset>
                <legend>Reserva tu cita</legend>
                <form action="#" method="post">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required />

                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required />

                    <label for="sede">Selecciona la sede:</label>
                    <select id="sede" name="sede" required>
                        <option value="">Seleccionar sede</option>
                        <option value="lima">Lima</option>
                        <option value="miraflores">Miraflores</option>
                    </select>

                    <label for="servicio">Servicio a realizar:</label>
                    <select id="servicio" name="servicio" required>
                        <option value="">Seleccionar servicio</option>
                        <option value="gelish">Manicure Gelish</option>
                        <option value="acrilicas">Uñas Acrílicas</option>
                    </select>

                    <button type="submit">Reservar Cita</button>
                </form>
            </fieldset>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Finas Nails - Todos los derechos reservados.</p>
    </footer>

</body>
</html>
